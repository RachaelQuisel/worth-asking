# assume clients, accounts, channels, or local paths.
#
# manual_clients is the local review list. scheduled_clients is the shorter
# allowlist the scheduled automation may post for. A longer manual list is
# intentional: you can review a client by hand without auto-posting it.
# Every name below is a fake placeholder.

